services:
  mariadb:
    image: mariadb:10
    environment:
      - MARIADB_DATABASE=hobbyhub
      - MARIADB_USER=${DATABASE_USER:-hobbyhub}
      - MARIADB_PASSWORD=${DATABASE_PASSWORD:-hobbyhub}
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
    ports:
      - "3306:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./api/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  php:
    build: ./api
    ports:
      - "8081:80"
    environment:
      - DB_HOST=mariadb
      - DB_NAME=hobbyhub
      - DB_USER=${DATABASE_USER:-hobbyhub}
      - DB_PASSWORD=${DATABASE_PASSWORD:-hobbyhub}
      # Real value goes in .env (gitignored), never here. Empty is a working
      # state: BggClient sends no Authorization header and answers from the
      # bgg_ranks dump instead. Production sets this in config.local.php.
      - BGG_API_TOKEN=${BGG_API_TOKEN:-}
    depends_on:
      - mariadb

  # Vite dev server, not the production nginx build - this compose file is
  # local dev/staging only, production deploys straight to IONOS via SFTP
  # (see .github/workflows/deploy.yml).
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://php:80
    depends_on:
      - php

volumes:
  mariadbdata:
  frontend_node_modules:
