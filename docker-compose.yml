services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=hobbyhub
      - POSTGRES_USER=${DATABASE_USER:-hobbyhub}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-hobbyhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/hobbyhub
      - DATABASE_USER=${DATABASE_USER:-hobbyhub}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-hobbyhub}
      # dev profile exposes password-reset tokens in the API response (see
      # docs/adr/0007) so the flow is testable locally without real SMTP -
      # never set this in a real deployment.
      - SPRING_PROFILES_ACTIVE=dev
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
