services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=hobbyhub
      - POSTGRES_USER=${DATABASE_USER:-hobbyhub}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-hobbyhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/hobbyhub
      - DATABASE_USER=${DATABASE_USER:-hobbyhub}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-hobbyhub}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend

volumes:
  pgdata:
