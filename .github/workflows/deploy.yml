name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Direct SFTP protocol upload (not rsync-over-ssh) - IONOS Webhosting
      # Plus only exposes the SFTP file-transfer subsystem, not a full SSH
      # shell, so an rsync-based action (which needs to execute `rsync` on
      # the remote side) would not work here.
      #
      # Plain lftp, not a marketplace action: Dylan700/sftp-upload-action@v1.2.4
      # silently no-ops under the Node 24 runtime GitHub now forces
      # (job goes green, zero files actually transferred - confirmed via a
      # raw lftp connectivity test that DID work with the same secrets).
      #
      # No --delete flag on either mirror: the target webspace root and
      # public/api/ both already hold real files uploaded outside git
      # (frontend static assets accumulate build hashes; api/ holds
      # config.local.php, gitignored production DB credentials that do not
      # exist in this checkout at all). A mirroring delete would wipe
      # config.local.php on every deploy.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to IONOS via SFTP
        run: |
          set -e
          lftp -u "$IONOS_SFTP_USER,$IONOS_SFTP_PASSWORD" -p 22 sftp://$IONOS_SFTP_HOST -e "
            set sftp:auto-confirm yes;
            mirror -R --verbose frontend/dist public;
            mirror -R --verbose -X vendor/ -X tests/ -X composer.json -X composer.lock -X phpunit.xml api public/api;
            bye
          "
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}

      # A green SFTP step isn't proof anything actually landed (see the
      # commit that replaced Dylan700/sftp-upload-action - it stayed green
      # while silently uploading nothing). Fail the job if the live site
      # doesn't actually respond correctly after the upload.
      - name: Smoke-test live deployment
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" https://sheoforge.de/)
          if [ "$status" != "200" ]; then
            echo "Frontend check failed: https://sheoforge.de/ returned $status"
            exit 1
          fi
          health=$(curl -s https://sheoforge.de/api/health)
          if [ "$health" != '{"status":"ok"}' ]; then
            echo "API health check failed: got '$health'"
            exit 1
          fi
          echo "Smoke test passed: frontend 200, API health ok"
