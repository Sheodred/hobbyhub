name: Deploy

on:
  push:
    branches: [main]
  # Re-deploying the current main used to need an empty commit, or a rerun of
  # an old run - which redeploys that run's commit, not main. During the
  # 2026-08-16 IONOS outage that made "try again now" unnecessarily awkward.
  workflow_dispatch:

# One deploy at a time against the one webspace. Queued, never cancelled:
# cancel-in-progress would kill a live mirror halfway through and leave the
# target in a state no run has ever produced. On 2026-08-16 a second merge
# started a second mirror on top of a stuck one, and two lftp sessions then
# sat on the same endpoint for over an hour.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A hung SFTP connect would otherwise run until GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Runs before the build on purpose: when the endpoint is down there is
      # no reason to spend two minutes producing a bundle nobody can upload.
      # One connection, one listing, no retries - this answers "can we deploy
      # at all", and the upload step below still does its own retrying.
      #
      # The two failure modes are worth telling apart, because they point at
      # different people: a closed session is authentication (our credentials
      # or a locked account), a timeout is the endpoint not answering at all
      # (IONOS). Getting that wrong cost most of an afternoon on 2026-08-16.
      - name: Check the SFTP endpoint before building
        run: |
          set +e
          # debug 3 is not decoration: without it lftp reports only "Fatal
          # error: max-retries exceeded" and swallows the reason, which made
          # the first version of this step unable to tell the two failure
          # modes apart - the one thing it exists to do.
          out=$(lftp -u "$IONOS_SFTP_USER,$IONOS_SFTP_PASSWORD" -p 22 "sftp://$IONOS_SFTP_HOST" -e "
            debug 3;
            set net:timeout 15;
            set net:max-retries 1;
            set sftp:auto-confirm yes;
            cls -1 .;
            bye
          " 2>&1)
          code=$?
          set -e

          if [ $code -eq 0 ]; then
            echo "Endpoint answered and authenticated; $(printf '%s\n' "$out" | grep -c . ) entries in the target directory."
            exit 0
          fi

          printf '%s\n' "$out"
          case "$out" in
            *"Connection closed"*|*"Permission denied"*|*"Login failed"*)
              echo "::error::SFTP closed the session at authentication. The credentials are rejected or the account is locked - see the 'When a deploy hangs' section in docs/deploy-checklist.md." ;;
            *Timeout*|*"not reachable"*|*"Network unreachable"*|*"Connection refused"*)
              echo "::error::SFTP endpoint did not answer. That is on IONOS - nothing in this repo will fix it." ;;
            *"max-retries exceeded"*)
              echo "::error::SFTP did not complete a session and lftp gave no reason - check the debug lines above before assuming which side is at fault." ;;
            *)
              echo "::error::SFTP preflight failed for an unrecognised reason (above)." ;;
          esac
          exit 1
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Direct SFTP protocol upload (not rsync-over-ssh) - IONOS Webhosting
      # Plus only exposes the SFTP file-transfer subsystem, not a full SSH
      # shell, so an rsync-based action (which needs to execute `rsync` on
      # the remote side) would not work here.
      #
      # Plain lftp, not a marketplace action: Dylan700/sftp-upload-action@v1.2.4
      # silently no-ops under the Node 24 runtime GitHub now forces
      # (job goes green, zero files actually transferred - confirmed via a
      # raw lftp connectivity test that DID work with the same secrets).
      #
      # No --delete flag on either mirror: the target webspace root and
      # public/api/ both already hold real files uploaded outside git
      # (frontend static assets accumulate build hashes; api/ holds
      # config.local.php, gitignored production DB credentials that do not
      # exist in this checkout at all). A mirroring delete would wipe
      # config.local.php on every deploy.
      # The settings below exist because of a real 72-minute hang (2026-08-16).
      # lftp's defaults let a stalled connect wait forever, and `mirror
      # --verbose` prints nothing until the first file moves - so the log was
      # completely empty and a dead session looked exactly like a slow upload.
      # The run before it had recovered on its own after 5m02s of the same
      # silence, which is why the retry loop is worth having: fail each attempt
      # fast, say so, and try again rather than hanging.
      - name: Deploy to IONOS via SFTP
        run: |
          set -e
          upload() {
            lftp -u "$IONOS_SFTP_USER,$IONOS_SFTP_PASSWORD" -p 22 sftp://$IONOS_SFTP_HOST -e "
              debug 3;
              set net:timeout 20;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set sftp:auto-confirm yes;
              mirror -R --verbose frontend/dist public;
              mirror -R --verbose -X vendor/ -X tests/ -X composer.json -X composer.lock -X phpunit.xml api public/api;
              bye
            "
          }

          for attempt in 1 2 3; do
            echo "::group::SFTP attempt $attempt"
            if upload; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed. Waiting 60s before retrying."
            sleep 60
          done

          echo "All three SFTP attempts failed - the endpoint is not accepting the connection."
          exit 1
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}

      # A green SFTP step isn't proof anything actually landed (see the
      # commit that replaced Dylan700/sftp-upload-action - it stayed green
      # while silently uploading nothing). Fail the job if the live site
      # doesn't actually respond correctly after the upload.
      - name: Smoke-test live deployment
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" https://sheoforge.de/)
          if [ "$status" != "200" ]; then
            echo "Frontend check failed: https://sheoforge.de/ returned $status"
            exit 1
          fi
          health=$(curl -s https://sheoforge.de/api/health)
          if [ "$health" != '{"status":"ok"}' ]; then
            echo "API health check failed: got '$health'"
            exit 1
          fi
          # #166: an unmatched /api/ path must render the SPA shell (React
          # Router's styled 404) while KEEPING its status. The failure mode
          # this guards is specific: pointing ErrorDocument at a full URL
          # instead of a local path silently turns the 404 into a 302, which
          # still "looks fixed" in a browser. -L is deliberately absent so a
          # redirect shows up as 302 rather than being followed to a 200.
          for path in /api/boardgame /api/; do
            code=$(curl -s -o /tmp/err_body -w "%{http_code}" "https://sheoforge.de${path}")
            case "$path" in
              /api/) want=403 ;;
              *)     want=404 ;;
            esac
            if [ "$code" != "$want" ]; then
              echo "Error-page check failed: $path returned $code, expected $want"
              exit 1
            fi
            if ! grep -q '<div id="root">' /tmp/err_body; then
              echo "Error-page check failed: $path did not serve the SPA shell"
              head -c 200 /tmp/err_body
              exit 1
            fi
          done
          echo "Smoke test passed: frontend 200, API health ok, /api/ error pages styled with status preserved"
