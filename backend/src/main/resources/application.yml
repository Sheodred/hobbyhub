spring:
  application:
    name: hobbyhub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hobbyhub}
    username: ${DATABASE_USER:hobbyhub}
    password: ${DATABASE_PASSWORD:hobbyhub}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    # DEV-ONLY default - must be overridden via JWT_SECRET in any real
    # deployment. At least 32 bytes (HMAC-SHA256 requirement).
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-please-change-me-32b}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
  password-reset:
    token-ttl-seconds: 3600
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:true}
